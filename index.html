<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>平衡極限挑戰 - Tilt Stopwatch</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    /* 基礎與手機體驗優化 - Google Material 明亮主題 */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F8F9FA;
      color: #202124;
    }

    .font-mono-tabular {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    /* 急促紅光閃爍動畫 (Google 紅 #EA4335 與高對比白底交替，約 9Hz) */
    @keyframes alarmStrobe {
      0%, 49% {
        background-color: #EA4335;
        box-shadow: inset 0 0 60px rgba(179, 20, 18, 0.45);
      }
      50%, 100% {
        background-color: #FFFFFF;
        box-shadow: inset 0 0 50px rgba(234, 67, 53, 0.35);
      }
    }

    .alarm-flashing {
      animation: alarmStrobe 0.11s infinite linear !important;
    }

    /* Material 柔和卡片陰影 */
    .g-card {
      background-color: #FFFFFF;
      border: 1px solid #E8EAED;
      box-shadow: 0 2px 6px rgba(60, 64, 67, 0.08), 0 1px 2px rgba(60, 64, 67, 0.06);
    }

    /* 遊戲按鈕動態與觸覺回饋 */
    .game-btn {
      transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease, background-color 0.15s ease, opacity 0.2s ease;
    }
    .game-btn:active:not(:disabled) {
      transform: scale(0.97);
    }
    .game-btn:disabled {
      background: #E8EAED !important;
      color: #9AA0A6 !important;
      border-color: #DADCE0 !important;
      box-shadow: none !important;
      cursor: not-allowed;
    }

    /* 進度環平滑過渡 */
    .ring-transition {
      transition: stroke-dashoffset 0.05s linear, stroke 0.2s ease;
    }
  </style>
</head>
<body class="flex flex-col justify-between items-center relative">

  <!-- 頂部 Google 經典四色裝飾條 (藍 #4285F4 / 紅 #EA4335 / 黃 #FBBC05 / 綠 #34A853) -->
  <div class="w-full h-1.5 grid grid-cols-4 shrink-0 z-10">
    <div class="bg-[#4285F4]"></div>
    <div class="bg-[#EA4335]"></div>
    <div class="bg-[#FBBC05]"></div>
    <div class="bg-[#34A853]"></div>
  </div>

  <!-- 主視覺容器 (100dvh 響應式佈局，專為手機單手/雙手操作設計) -->
  <div id="appRoot" class="w-full flex-1 max-w-md mx-auto flex flex-col justify-between px-4 py-3 sm:py-5 transition-colors duration-150 overflow-hidden">

    <!-- 頂部標題與感測器即時狀態列 -->
    <header class="w-full flex items-center justify-between gap-2 pt-0.5">
      <div class="flex items-center gap-2">
        <!-- Google 四色圓點圖示 -->
        <div class="flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-[#4285F4]"></span>
          <span class="w-2 h-2 rounded-full bg-[#EA4335]"></span>
          <span class="w-2 h-2 rounded-full bg-[#FBBC05]"></span>
          <span class="w-2 h-2 rounded-full bg-[#34A853]"></span>
        </div>
        <h1 class="text-base sm:text-lg font-extrabold tracking-tight text-[#202124]">平衡計時挑戰</h1>
      </div>

      <div class="flex items-center gap-1.5 bg-white border border-[#DADCE0] px-3 py-1 rounded-full shadow-sm">
        <span id="sensorDot" class="w-2 h-2 rounded-full bg-[#FBBC05] animate-pulse"></span>
        <span id="sensorStatusText" class="text-xs font-semibold text-[#5F6368]">等待感測器啟動</span>
      </div>
    </header>

    <!-- 中央核心儀表與碼表區 -->
    <main class="flex-1 w-full flex flex-col items-center justify-center my-1.5 relative">

      <!-- 狀態橫幅提示膠囊 -->
      <div id="phaseBadge" class="mb-2.5 px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold tracking-wide bg-[#E8F0FE] text-[#1A73E8] border border-[#D2E3FC] shadow-sm">
        步驟 1：設定傾斜角度上限
      </div>

      <!-- 圓形視覺傾角與倒數進度環卡片 -->
      <div class="g-card relative w-60 h-60 sm:w-68 sm:h-68 rounded-full flex items-center justify-center p-2">
        <!-- SVG 進度環 -->
        <svg class="w-full h-full -rotate-90 transform" viewBox="0 0 260 260">
          <!-- 背景底環 -->
          <circle cx="130" cy="130" r="114" fill="#FFFFFF" stroke="#F1F3F4" stroke-width="14" />
          <!-- 動態進度環 (用於 3 秒穩定倒數 & 角度比例指示) -->
          <circle id="progressRing" class="ring-transition" cx="130" cy="130" r="114" fill="none"
                  stroke="#4285F4" stroke-width="14" stroke-linecap="round"
                  stroke-dasharray="716.28" stroke-dashoffset="716.28" />
        </svg>

        <!-- 圓環中央資訊疊層 -->
        <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-4">
          <span class="text-xs font-semibold tracking-wider text-[#5F6368] mb-0.5">目前傾斜角度</span>
          <div id="currentAngleDisplay" class="font-mono-tabular text-5xl sm:text-6xl font-extrabold text-[#202124] tracking-tight">
            0.0°
          </div>

          <!-- 上限門檻顯示膠囊 -->
          <div class="mt-2 flex items-center gap-1.5 bg-[#F8F9FA] border border-[#DADCE0] px-3 py-1 rounded-full">
            <span class="text-xs font-medium text-[#5F6368]">傾斜上限:</span>
            <span id="limitAngleDisplay" class="font-mono-tabular text-xs sm:text-sm font-extrabold text-[#E37400]">未設定</span>
          </div>

          <!-- 3秒穩定倒數顯示 (僅在 CALIBRATING 顯示) -->
          <div id="calibrateSubBox" class="hidden mt-1.5">
            <span id="calibrateTimerText" class="font-mono-tabular text-xl font-black text-[#1E8E3E]">3.0s</span>
          </div>
        </div>
      </div>

      <!-- 碼表計時主顯示卡片 (MM:SS.mmm) -->
      <div class="g-card w-full mt-3.5 rounded-3xl py-3.5 px-5 flex flex-col items-center">
        <div class="w-full flex items-center justify-between text-xs font-semibold text-[#5F6368] mb-1 px-1">
          <span>計時碼表 (分:秒:毫秒)</span>
          <span id="triggerAngleNote" class="text-[#D93025] font-mono-tabular font-bold hidden">觸發時: 0.0°</span>
        </div>
        <div id="stopwatchDisplay" class="font-mono-tabular text-4xl sm:text-5xl font-extrabold tracking-tight text-[#202124]">
          00:00.000
        </div>
        <p id="instructionText" class="text-xs sm:text-sm text-center text-[#5F6368] mt-1.5 min-h-[1.25rem] font-medium leading-snug">
          擺好極限斜度後按左鍵「設定上限」，再按右鍵「開始挑戰」
        </p>
      </div>
    </main>

    <!-- 底部操作按鈕區 -->
    <footer class="w-full pb-2 shrink-0">
      <!-- 初始狀態：同一水平列一左一右等寬並排雙按鈕 -->
      <div id="idleControls" class="w-full grid grid-cols-2 gap-3">
        <!-- 左側按鈕：設定傾斜角度上限 (Google 綠主題) -->
        <button id="setLimitBtn" type="button"
                class="game-btn w-full py-4 px-2.5 rounded-2xl font-extrabold text-sm sm:text-base tracking-tight bg-[#34A853] hover:bg-[#2E9549] text-white shadow-md shadow-[#34A853]/25 border border-[#2D9348] flex items-center justify-center text-center leading-tight">
          設定傾斜角度上限
        </button>

        <!-- 右側按鈕：開始挑戰 (Google 藍主題) -->
        <button id="startBtn" type="button" disabled
                class="game-btn w-full py-4 px-2.5 rounded-2xl font-extrabold text-base sm:text-lg tracking-wide bg-[#4285F4] hover:bg-[#3367D6] text-white shadow-md shadow-[#4285F4]/25 border border-[#3B78E7] flex items-center justify-center text-center leading-tight">
          開始挑戰
        </button>
      </div>

      <!-- 校準中或計時中的狀態提示條（防誤觸鎖定，保持高度一致避免畫面跳動） -->
      <div id="activeStatusBar" class="hidden w-full py-4 px-4 rounded-2xl bg-white border border-[#DADCE0] shadow-sm text-center">
        <span id="activeStatusLabel" class="text-sm sm:text-base font-bold text-[#1E8E3E] tracking-wide">
          保持穩定滿 3 秒自動鳴笛開始...
        </span>
      </div>

      <!-- 5秒警報結束後的全寬「重新開始」按鈕 -->
      <button id="restartBtn" type="button"
              class="hidden game-btn w-full py-4 px-5 rounded-2xl font-extrabold text-base sm:text-lg tracking-wider bg-[#4285F4] hover:bg-[#3367D6] text-white shadow-md shadow-[#4285F4]/30 border border-[#3B78E7]">
        重新開始
      </button>
    </footer>

  </div>

  <script>
    /**
     * 遊戲狀態定義
     * IDLE: 初始待機，顯示即時角度，可設定傾斜上限與按下開始
     * CALIBRATING: 連續維持在傾斜上限內 3.0 秒準備期
     * RUNNING: 起跑號角響起，正式碼表計時中
     * ALARM: 超出傾斜上限，碼表凍結，整片紅閃 + 急促蜂鳴 5 秒鎖定
     * GAME_OVER: 5 秒警示結束，顯示最終成績與「重新開始」按鈕
     */
    const GAME_STATE = {
      IDLE: 'IDLE',
      CALIBRATING: 'CALIBRATING',
      RUNNING: 'RUNNING',
      ALARM: 'ALARM',
      GAME_OVER: 'GAME_OVER'
    };

    // 核心狀態變數
    let currentState = GAME_STATE.IDLE;
    let currentTiltDeg = 0.0;        // 經過低通濾波的總傾斜角度 (0° ~ 90°)
    let rawTiltDeg = 0.0;            // 原始感測計算角度
    let tiltLimitDeg = null;         // 鎖定的傾斜角度上限 (null 代表尚未設定)
    let isLimitSet = false;          // 是否已按下「設定傾斜角度上限」

    // 感測器狀態
    let sensorActive = false;
    let usingRealMotionSensor = false;
    let hasFilteredInit = false;
    const FILTER_ALPHA = 0.28;       // 低通濾波係數 (兼顧靈敏度與抗手抖)

    // 計時與動畫控制
    const CALIBRATE_REQUIRED_MS = 3000; // 需連續保持穩定 3 秒
    const ALARM_DURATION_MS = 5000;     // 失敗紅閃蜂鳴鎖定 5 秒
    let calibrateStartTime = null;
    let runStartTime = null;
    let finalElapsedMs = 0;
    let alarmEndTimeout = null;
    let rafId = null;

    // Web Audio API & Wake Lock
    let audioCtx = null;
    let alarmIntervalId = null;
    let wakeLockSentinel = null;

    // 圓環周長 (r = 114 -> 2 * PI * 114 ≈ 716.28)
    const RING_CIRCUMFERENCE = 2 * Math.PI * 114;

    // DOM 元素快取
    const el = {
      appRoot: document.getElementById('appRoot'),
      sensorDot: document.getElementById('sensorDot'),
      sensorStatusText: document.getElementById('sensorStatusText'),
      phaseBadge: document.getElementById('phaseBadge'),
      progressRing: document.getElementById('progressRing'),
      currentAngleDisplay: document.getElementById('currentAngleDisplay'),
      limitAngleDisplay: document.getElementById('limitAngleDisplay'),
      calibrateSubBox: document.getElementById('calibrateSubBox'),
      calibrateTimerText: document.getElementById('calibrateTimerText'),
      stopwatchDisplay: document.getElementById('stopwatchDisplay'),
      triggerAngleNote: document.getElementById('triggerAngleNote'),
      instructionText: document.getElementById('instructionText'),
      idleControls: document.getElementById('idleControls'),
      setLimitBtn: document.getElementById('setLimitBtn'),
      startBtn: document.getElementById('startBtn'),
      activeStatusBar: document.getElementById('activeStatusBar'),
      activeStatusLabel: document.getElementById('activeStatusLabel'),
      restartBtn: document.getElementById('restartBtn')
    };

    /* =========================================================================
       1. Web Audio API 音效合成引擎 (大聲起跑號角 & 急促蜂鳴警報)
       ========================================================================= */

    /**
     * 初始化並解鎖 AudioContext（必須在使用者點擊按鈕事件中呼叫）
     */
    function initAndUnlockAudio() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        // 播放極短靜音緩衝區確保 iOS Safari 完全解鎖音訊通道
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
      } catch (err) {
        console.warn('AudioContext 初始化警告:', err);
      }
    }

    /**
     * 播放大聲「起跑號角」音效 (滿 3 秒進入計時瞬間觸發)
     * 多顆鋸齒波與方波疊加銅管和弦 + 動態壓縮器推大音量
     */
    function playStartHorn() {
      if (!audioCtx) initAndUnlockAudio();
      if (!audioCtx) return;

      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const duration = 0.85;

        const compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-12, now);
        compressor.knee.setValueAtTime(10, now);
        compressor.ratio.setValueAtTime(8, now);
        compressor.attack.setValueAtTime(0.005, now);
        compressor.release.setValueAtTime(0.15, now);
        compressor.connect(audioCtx.destination);

        const masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.01, now);
        masterGain.gain.linearRampToValueAtTime(1.0, now + 0.04);
        masterGain.gain.setValueAtTime(0.95, now + duration - 0.15);
        masterGain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        masterGain.connect(compressor);

        // 號角銅管和弦頻率 (F4 + A4 + C5 + F5)
        const freqs = [349.23, 440.00, 523.25, 698.46];

        freqs.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const filter = audioCtx.createBiquadFilter();
          const oscGain = audioCtx.createGain();

          osc.type = idx % 2 === 0 ? 'sawtooth' : 'square';
          osc.frequency.setValueAtTime(freq * 0.94, now);
          osc.frequency.exponentialRampToValueAtTime(freq, now + 0.06);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1400, now);
          filter.frequency.exponentialRampToValueAtTime(3200, now + 0.12);

          oscGain.gain.setValueAtTime(idx === 3 ? 0.35 : 0.45, now);

          osc.connect(filter);
          filter.connect(oscGain);
          oscGain.connect(masterGain);

          osc.start(now);
          osc.stop(now + duration);
        });
      } catch (err) {
        console.error('起跑號角播放失敗:', err);
      }
    }

    /**
     * 啟動 5 秒「急促蜂鳴警報聲」
     */
    function startAlarmBuzzer() {
      stopAlarmBuzzer();
      if (!audioCtx) initAndUnlockAudio();
      if (!audioCtx) return;

      let step = 0;
      const triggerSingleBeep = () => {
        if (!audioCtx || currentState !== GAME_STATE.ALARM) return;
        try {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const now = audioCtx.currentTime;
          const beepLen = 0.075;

          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'square';
          osc.frequency.setValueAtTime(step % 2 === 0 ? 2650 : 3150, now);

          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.95, now + 0.008);
          gain.gain.setValueAtTime(0.95, now + beepLen - 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + beepLen);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now);
          osc.stop(now + beepLen);
          step++;
        } catch (e) {
          console.warn('蜂鳴單音錯誤:', e);
        }
      };

      triggerSingleBeep();
      alarmIntervalId = setInterval(triggerSingleBeep, 130);
    }

    /**
     * 停止急促蜂鳴警報聲
     */
    function stopAlarmBuzzer() {
      if (alarmIntervalId !== null) {
        clearInterval(alarmIntervalId);
        alarmIntervalId = null;
      }
    }

    /* =========================================================================
       2. 螢幕常亮控制 (Screen Wake Lock API)
       ========================================================================= */
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && !wakeLockSentinel) {
          wakeLockSentinel = await navigator.wakeLock.request('screen');
          wakeLockSentinel.addEventListener('release', () => {
            wakeLockSentinel = null;
          });
        }
      } catch (err) {
        // 部份瀏覽器或省電模式不支援時靜默忽略
      }
    }

    /* =========================================================================
       3. 手機動作與方向感測器邏輯 (總傾斜角度 0° ~ 90°)
       ========================================================================= */

    /**
     * 請求 iOS 13+ 感測器權限並綁定監聽器
     */
    async function ensureSensorPermission() {
      initAndUnlockAudio();
      requestWakeLock();

      if (sensorActive) return true;

      try {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          const motionRes = await DeviceMotionEvent.requestPermission();
          if (motionRes !== 'granted') {
            updateSensorStatus(false, '請允許動作感測權限');
            return false;
          }
        }

        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          try {
            await DeviceOrientationEvent.requestPermission();
          } catch (e) {
            // 忽略 orientation 權限錯誤，主要依賴 DeviceMotion
          }
        }

        bindSensorListeners();
        return true;
      } catch (err) {
        console.warn('感測器權限請求異常:', err);
        bindSensorListeners();
        return true;
      }
    }

    /**
     * 綁定 DeviceMotion 與 DeviceOrientation 事件
     */
    function bindSensorListeners() {
      if (sensorActive) return;
      sensorActive = true;

      window.addEventListener('devicemotion', handleDeviceMotion, { passive: true });
      window.addEventListener('deviceorientation', handleDeviceOrientation, { passive: true });

      updateSensorStatus(true, '感測器已連線');
    }

    /**
     * 處理重力加速度數據 -> 計算相對於完全水平面的真實總傾斜角度 (0° ~ 90°)
     */
    function handleDeviceMotion(event) {
      const acc = event.accelerationIncludingGravity;
      if (!acc || (acc.x === null && acc.y === null && acc.z === null)) return;

      const x = acc.x || 0;
      const y = acc.y || 0;
      const z = acc.z || 0;
      const magnitude = Math.sqrt(x * x + y * y + z * z);

      if (magnitude < 0.1) return;

      usingRealMotionSensor = true;
      updateSensorStatus(true, '感測器運作中');

      const cosTheta = Math.min(1, Math.max(0, Math.abs(z) / magnitude));
      const deg = Math.acos(cosTheta) * (180 / Math.PI);

      applyFilteredTilt(deg);
    }

    /**
     * 降級備援：若裝置僅回傳歐拉角 (beta / gamma)
     */
    function handleDeviceOrientation(event) {
      if (usingRealMotionSensor) return;
      if (event.beta === null || event.gamma === null) return;

      updateSensorStatus(true, '方向感測器運作中');

      const betaRad = (event.beta * Math.PI) / 180;
      const gammaRad = (event.gamma * Math.PI) / 180;
      const cosTotal = Math.min(1, Math.max(0, Math.abs(Math.cos(betaRad) * Math.cos(gammaRad))));
      const deg = Math.acos(cosTotal) * (180 / Math.PI);

      applyFilteredTilt(deg);
    }

    /**
     * 套用低通濾波器平滑微幅手抖雜訊
     */
    function applyFilteredTilt(newDeg) {
      rawTiltDeg = Math.min(90, Math.max(0, newDeg));
      if (!hasFilteredInit) {
        currentTiltDeg = rawTiltDeg;
        hasFilteredInit = true;
      } else {
        currentTiltDeg = currentTiltDeg + FILTER_ALPHA * (rawTiltDeg - currentTiltDeg);
      }
    }

    function updateSensorStatus(isOk, text) {
      el.sensorStatusText.textContent = text;
      if (isOk) {
        el.sensorDot.className = 'w-2 h-2 rounded-full bg-[#34A853]';
      } else {
        el.sensorDot.className = 'w-2 h-2 rounded-full bg-[#EA4335] animate-ping';
      }
    }

    /* =========================================================================
       4. 遊戲狀態機與流程控制
       ========================================================================= */

    /**
     * 格式化毫秒為 分:秒:毫秒 (MM:SS.mmm)
     */
    function formatStopwatch(ms) {
      const safeMs = Math.max(0, Math.floor(ms));
      const minutes = Math.floor(safeMs / 60000);
      const seconds = Math.floor((safeMs % 60000) / 1000);
      const millis = safeMs % 1000;

      const mm = String(minutes).padStart(2, '0');
      const ss = String(seconds).padStart(2, '0');
      const mmm = String(millis).padStart(3, '0');
      return `${mm}:${ss}.${mmm}`;
    }

    /**
     * 更新進度環顯示
     */
    function setRingProgress(ratio, colorHex) {
      const clamped = Math.min(1, Math.max(0, ratio));
      const offset = RING_CIRCUMFERENCE * (1 - clamped);
      el.progressRing.style.strokeDashoffset = offset.toFixed(2);
      el.progressRing.style.stroke = colorHex;
    }

    /**
     * 切換至階段一：IDLE (初始待機)
     */
    function enterIdleState() {
      currentState = GAME_STATE.IDLE;
      stopAlarmBuzzer();
      if (alarmEndTimeout) {
        clearTimeout(alarmEndTimeout);
        alarmEndTimeout = null;
      }

      document.body.classList.remove('alarm-flashing');

      finalElapsedMs = 0;
      calibrateStartTime = null;
      runStartTime = null;
      el.stopwatchDisplay.textContent = '00:00.000';
      el.stopwatchDisplay.className = 'font-mono-tabular text-4xl sm:text-5xl font-extrabold tracking-tight text-[#202124]';
      el.triggerAngleNote.classList.add('hidden');
      el.calibrateSubBox.classList.add('hidden');

      if (isLimitSet) {
        el.phaseBadge.textContent = '上限已鎖定：可按右側「開始挑戰」';
        el.phaseBadge.className = 'mb-2.5 px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold tracking-wide bg-[#E6F4EA] text-[#137333] border border-[#CEEAD6] shadow-sm';
        el.instructionText.textContent = `上限為 ${tiltLimitDeg.toFixed(1)}°，可按左鍵重設或右鍵開始`;
      } else {
        el.phaseBadge.textContent = '步驟 1：設定傾斜角度上限';
        el.phaseBadge.className = 'mb-2.5 px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold tracking-wide bg-[#E8F0FE] text-[#1A73E8] border border-[#D2E3FC] shadow-sm';
        el.instructionText.textContent = '擺好極限斜度後按左鍵「設定上限」，再按右鍵「開始挑戰」';
      }

      el.idleControls.classList.remove('hidden');
      el.activeStatusBar.classList.add('hidden');
      el.restartBtn.classList.add('hidden');

      el.startBtn.disabled = !isLimitSet;
      setRingProgress(0, '#4285F4');
    }

    /**
     * 按下左側「設定傾斜角度上限」
     */
    async function handleSetLimit() {
      await ensureSensorPermission();
      if (currentState !== GAME_STATE.IDLE) return;

      const captured = Math.max(0.5, Number(currentTiltDeg.toFixed(1)));
      tiltLimitDeg = captured;
      isLimitSet = true;

      el.limitAngleDisplay.textContent = `${tiltLimitDeg.toFixed(1)}°`;
      el.limitAngleDisplay.className = 'font-mono-tabular text-xs sm:text-sm font-extrabold text-[#137333]';

      el.phaseBadge.textContent = '上限已鎖定！請按右側「開始挑戰」';
      el.phaseBadge.className = 'mb-2.5 px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold tracking-wide bg-[#E6F4EA] text-[#137333] border border-[#CEEAD6] shadow-sm';

      el.instructionText.textContent = `已鎖定上限為 ${tiltLimitDeg.toFixed(1)}°（按左鍵可重設，按右鍵開始）`;
      el.startBtn.disabled = false;
    }

    /**
     * 按下右側「開始挑戰」 -> 進入階段二：CALIBRATING (連續 3 秒穩定準備期)
     */
    async function handleStartGame() {
      await ensureSensorPermission();
      if (!isLimitSet || tiltLimitDeg === null) return;
      if (currentState !== GAME_STATE.IDLE) return;

      currentState = GAME_STATE.CALIBRATING;
      calibrateStartTime = null;

      el.idleControls.classList.add('hidden');
      el.restartBtn.classList.add('hidden');
      el.activeStatusBar.classList.remove('hidden');
      el.calibrateSubBox.classList.remove('hidden');

      el.phaseBadge.textContent = '準備期：連續保持穩定 3 秒';
      el.phaseBadge.className = 'mb-2.5 px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold tracking-wide bg-[#FEF7E0] text-[#B06000] border border-[#FEEFC3] shadow-sm';
      el.activeStatusLabel.textContent = '保持在上限角度內滿 3 秒...';
      el.activeStatusLabel.className = 'text-sm sm:text-base font-bold text-[#B06000] tracking-wide';
    }

    /**
     * 進入階段三：RUNNING (起跑號角 + 正式碼表計時)
     */
    function enterRunningState(now) {
      currentState = GAME_STATE.RUNNING;
      runStartTime = now;

      // 吹響大聲起跑號角音效
      playStartHorn();

      el.calibrateSubBox.classList.add('hidden');
      el.phaseBadge.textContent = '計時中！請勿超過傾斜上限';
      el.phaseBadge.className = 'mb-2.5 px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold tracking-wide bg-[#E6F4EA] text-[#137333] border border-[#CEEAD6] shadow-sm';

      el.stopwatchDisplay.className = 'font-mono-tabular text-4xl sm:text-5xl font-extrabold tracking-tight text-[#1E8E3E]';
      el.instructionText.textContent = `保持傾斜角度 ≤ ${tiltLimitDeg.toFixed(1)}°！超過即刻停止`;
      el.activeStatusLabel.textContent = '挑戰進行中（超過上限將鳴笛警示）';
      el.activeStatusLabel.className = 'text-sm sm:text-base font-bold text-[#1E8E3E] tracking-wide';
    }

    /**
     * 進入階段四：ALARM (超出上限！碼表停止 + 急促紅閃 + 急促蜂鳴 5 秒鎖定)
     */
    function enterAlarmState(now, triggerDeg) {
      currentState = GAME_STATE.ALARM;
      finalElapsedMs = now - runStartTime;

      // 凍結碼表成績
      el.stopwatchDisplay.textContent = formatStopwatch(finalElapsedMs);
      el.stopwatchDisplay.className = 'font-mono-tabular text-4xl sm:text-5xl font-extrabold tracking-tight text-[#D93025]';

      // 顯示觸發失敗當下的角度
      el.triggerAngleNote.textContent = `觸發傾角: ${triggerDeg.toFixed(1)}° (> ${tiltLimitDeg.toFixed(1)}°)`;
      el.triggerAngleNote.classList.remove('hidden');

      // 啟動整片急促紅光閃爍 & 急促蜂鳴 5 秒
      document.body.classList.add('alarm-flashing');
      startAlarmBuzzer();

      el.phaseBadge.textContent = '超出傾斜上限！挑戰失敗';
      el.phaseBadge.className = 'mb-2.5 px-4 py-1.5 rounded-full text-xs sm:text-sm font-black tracking-wide bg-[#D93025] text-white border border-[#B31412] shadow';
      el.instructionText.textContent = '警示鎖定 5 秒鐘，請稍候...';
      el.activeStatusLabel.textContent = '失衡警報鳴響中 (5 秒鎖定)';
      el.activeStatusLabel.className = 'text-sm sm:text-base font-black text-[#D93025] tracking-wide';

      setRingProgress(1, '#EA4335');

      // 鎖定滿 5.0 秒後自動切換到階段五 (GAME_OVER)
      alarmEndTimeout = setTimeout(() => {
        enterGameOverState();
      }, ALARM_DURATION_MS);
    }

    /**
     * 進入階段五：GAME_OVER (5 秒警示結束，下方出現「重新開始」按鈕)
     */
    function enterGameOverState() {
      currentState = GAME_STATE.GAME_OVER;

      document.body.classList.remove('alarm-flashing');
      stopAlarmBuzzer();

      el.phaseBadge.textContent = '挑戰結束 - 最終成績';
      el.phaseBadge.className = 'mb-2.5 px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold tracking-wide bg-[#FCE8E6] text-[#C5221F] border border-[#FAD2CF] shadow-sm';
      el.stopwatchDisplay.className = 'font-mono-tabular text-4xl sm:text-5xl font-extrabold tracking-tight text-[#D93025]';
      el.instructionText.textContent = '點擊下方「重新開始」回到初始畫面';

      el.activeStatusBar.classList.add('hidden');
      el.restartBtn.classList.remove('hidden');
    }

    /* =========================================================================
       5. 主動畫與高頻判定迴圈 (requestAnimationFrame)
       ========================================================================= */
    function mainLoop(now) {
      el.currentAngleDisplay.textContent = `${currentTiltDeg.toFixed(1)}°`;

      if (currentState === GAME_STATE.IDLE) {
        const refMax = isLimitSet && tiltLimitDeg > 0 ? tiltLimitDeg : 45;
        const ratio = currentTiltDeg / refMax;
        const isOver = isLimitSet && currentTiltDeg > tiltLimitDeg;
        setRingProgress(Math.min(1, ratio), isOver ? '#EA4335' : '#4285F4');
        el.currentAngleDisplay.className = `font-mono-tabular text-5xl sm:text-6xl font-extrabold tracking-tight ${isOver ? 'text-[#D93025]' : 'text-[#202124]'}`;
      }
      else if (currentState === GAME_STATE.CALIBRATING) {
        if (currentTiltDeg <= tiltLimitDeg) {
          if (calibrateStartTime === null) {
            calibrateStartTime = now;
          }
          const heldMs = now - calibrateStartTime;
          const remainingSec = Math.max(0, (CALIBRATE_REQUIRED_MS - heldMs) / 1000);
          const progress = heldMs / CALIBRATE_REQUIRED_MS;

          el.calibrateTimerText.textContent = `${remainingSec.toFixed(1)}s`;
          el.calibrateTimerText.className = 'font-mono-tabular text-xl font-black text-[#1E8E3E]';
          el.currentAngleDisplay.className = 'font-mono-tabular text-5xl sm:text-6xl font-extrabold tracking-tight text-[#1E8E3E]';
          el.instructionText.textContent = `保持穩定！還需維持 ${remainingSec.toFixed(1)} 秒...`;
          setRingProgress(progress, '#34A853');

          if (heldMs >= CALIBRATE_REQUIRED_MS) {
            enterRunningState(now);
          }
        } else {
          // 中途超出傾斜角度上限 -> 3 秒歸零重算
          calibrateStartTime = null;
          el.calibrateTimerText.textContent = '3.0s';
          el.calibrateTimerText.className = 'font-mono-tabular text-xl font-black text-[#D93025]';
          el.currentAngleDisplay.className = 'font-mono-tabular text-5xl sm:text-6xl font-extrabold tracking-tight text-[#D93025]';
          el.instructionText.textContent = `超出上限 (${tiltLimitDeg.toFixed(1)}°)！請回穩重新計算 3 秒`;
          setRingProgress(0, '#FBBC05');
        }
      }
      else if (currentState === GAME_STATE.RUNNING) {
        const elapsed = now - runStartTime;
        el.stopwatchDisplay.textContent = formatStopwatch(elapsed);

        const dangerRatio = tiltLimitDeg > 0 ? currentTiltDeg / tiltLimitDeg : 1;
        setRingProgress(Math.min(1, dangerRatio), dangerRatio > 0.85 ? '#FBBC05' : '#34A853');

        // 只要往任何方向傾斜超過上限角度，立刻觸發失敗
        if (currentTiltDeg > tiltLimitDeg) {
          enterAlarmState(now, currentTiltDeg);
        }
      }

      rafId = requestAnimationFrame(mainLoop);
    }

    /* =========================================================================
       6. 事件綁定與初始化
       ========================================================================= */
    el.setLimitBtn.addEventListener('click', handleSetLimit);
    el.startBtn.addEventListener('click', handleStartGame);
    el.restartBtn.addEventListener('click', () => {
      initAndUnlockAudio();
      enterIdleState();
    });

    window.addEventListener('load', () => {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission !== 'function') {
        bindSensorListeners();
      }
      enterIdleState();
      rafId = requestAnimationFrame(mainLoop);
    });
  </script>
</body>
</html>
