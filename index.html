<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>平衡極限挑戰 - Tilt Stopwatch</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">

  <style>
    /* 基礎與手機體驗優化 */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #090d16;
      color: #f8fafc;
    }

    .font-mono-tabular {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    /* 急促紅光閃爍動畫 (約 9Hz 高對比警示閃爍) */
    @keyframes alarmStrobe {
      0%, 49% {
        background-color: #dc2626; /* 亮紅 */
        box-shadow: inset 0 0 80px rgba(255, 255, 255, 0.45);
      }
      50%, 100% {
        background-color: #1a0303; /* 極暗紅黑 */
        box-shadow: inset 0 0 40px rgba(220, 38, 38, 0.3);
      }
    }

    .alarm-flashing {
      animation: alarmStrobe 0.11s infinite linear !important;
    }

    /* 遊戲按鈕動態與立體感 */
    .game-btn {
      transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.15s ease, opacity 0.2s ease;
    }
    .game-btn:active:not(:disabled) {
      transform: scale(0.96);
    }
    .game-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      filter: grayscale(0.6);
    }

    /* 進度環動畫平滑 */
    .ring-transition {
      transition: stroke-dashoffset 0.05s linear, stroke 0.2s ease;
    }

    /* 自訂滑桿樣式 (桌面測試用) */
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      margin-top: -6px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 8px;
      cursor: pointer;
      background: #334155;
      border-radius: 999px;
    }
  </style>
</head>
<body class="flex flex-col justify-between items-center relative">

  <!-- 主視覺容器 (100dvh 響應式佈局) -->
  <div id="appRoot" class="w-full h-full max-w-md mx-auto flex flex-col justify-between px-5 py-4 sm:py-6 transition-colors duration-150">

    <!-- 頂部狀態列與感測器指示 -->
    <header class="w-full flex items-center justify-between gap-2 pt-1">
      <div class="flex items-center gap-2 bg-slate-900/80 border border-slate-800 px-3 py-1.5 rounded-full">
        <span id="sensorDot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
        <span id="sensorStatusText" class="text-xs font-semibold text-slate-300 tracking-wide">等待感測器啟動</span>
      </div>

      <!-- 桌面模擬測試開關按鈕 -->
      <button id="toggleSimBtn" type="button" class="text-xs font-semibold bg-slate-800/90 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-full">
        模擬測試
      </button>
    </header>

    <!-- 桌面模擬測試面板 (預設收合，點選右上角可展開) -->
    <div id="simPanel" class="hidden w-full bg-slate-900/95 border border-sky-500/40 rounded-2xl p-3.5 mt-2 shadow-xl z-20">
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-xs font-bold text-sky-400">桌面電腦模擬傾斜角度</span>
        <span id="simValLabel" class="font-mono-tabular text-xs font-bold text-white bg-sky-500/20 px-2 py-0.5 rounded">0.0°</span>
      </div>
      <input id="simSlider" type="range" min="0" max="45" step="0.1" value="0" class="w-full" />
      <p class="text-[11px] text-slate-400 mt-1.5">手機實際偵測到陀螺儀/加速度計時會自動覆蓋此模擬值。</p>
    </div>

    <!-- 中央核心儀表與碼表區 -->
    <main class="flex-1 w-full flex flex-col items-center justify-center my-2 relative">

      <!-- 狀態橫幅提示 -->
      <div id="phaseBadge" class="mb-3 px-4 py-1.5 rounded-full text-sm font-bold tracking-wider uppercase bg-slate-800/90 text-sky-400 border border-slate-700/80 shadow">
        步驟 1：設定傾斜角度上限
      </div>

      <!-- 圓形視覺傾角與倒數進度環 -->
      <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center">
        <!-- SVG 進度環 -->
        <svg class="w-full h-full -rotate-90 transform" viewBox="0 0 260 260">
          <!-- 背景底環 -->
          <circle cx="130" cy="130" r="114" fill="rgba(15, 23, 42, 0.75)" stroke="#1e293b" stroke-width="14" />
          <!-- 動態進度環 (用於 3 秒穩定倒數 & 角度比例指示) -->
          <circle id="progressRing" class="ring-transition" cx="130" cy="130" r="114" fill="none"
                  stroke="#38bdf8" stroke-width="14" stroke-linecap="round"
                  stroke-dasharray="716.28" stroke-dashoffset="716.28" />
        </svg>

        <!-- 圓環中央資訊疊層 -->
        <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-4">
          <!-- 即時傾斜角度大字 -->
          <span class="text-xs font-semibold uppercase tracking-widest text-slate-400 mb-0.5">目前傾斜角度</span>
          <div id="currentAngleDisplay" class="font-mono-tabular text-5xl sm:text-6xl font-extrabold text-white tracking-tight">
            0.0°
          </div>

          <!-- 上限門檻顯示膠囊 -->
          <div class="mt-2.5 flex items-center gap-1.5 bg-slate-950/80 border border-slate-800 px-3 py-1 rounded-full">
            <span class="text-xs text-slate-400">傾斜上限:</span>
            <span id="limitAngleDisplay" class="font-mono-tabular text-sm font-extrabold text-amber-400">未設定</span>
          </div>

          <!-- 3秒穩定倒數顯示 (僅在 CALIBRATING 顯示) -->
          <div id="calibrateSubBox" class="hidden mt-2">
            <span id="calibrateTimerText" class="font-mono-tabular text-xl font-black text-emerald-400">3.0s</span>
          </div>
        </div>
      </div>

      <!-- 碼表計時主顯示區 (MM:SS.mmm) -->
      <div class="w-full mt-4 bg-slate-900/90 border border-slate-800 rounded-3xl py-4 px-5 flex flex-col items-center shadow-2xl">
        <div class="w-full flex items-center justify-between text-xs font-semibold text-slate-400 mb-1 px-1">
          <span>計時碼表 (分:秒:毫秒)</span>
          <span id="triggerAngleNote" class="text-rose-400 font-mono-tabular hidden">觸發時: 0.0°</span>
        </div>
        <div id="stopwatchDisplay" class="font-mono-tabular text-4xl sm:text-5xl font-extrabold tracking-tight text-slate-200">
          00:00.000
        </div>
        <p id="instructionText" class="text-xs sm:text-sm text-center text-slate-300 mt-2 min-h-[1.25rem] font-medium">
          將手機擺到目標極限斜度，按下「設定傾斜角度上限」
        </p>
      </div>
    </main>

    <!-- 底部操作按鈕區 -->
    <footer class="w-full pb-2 flex flex-col gap-3">
      <!-- 初始狀態雙按鈕群組 -->
      <div id="idleControls" class="w-full flex flex-col gap-3">
        <button id="setLimitBtn" type="button"
                class="game-btn w-full py-4 px-5 rounded-2xl font-extrabold text-base sm:text-lg tracking-wide bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 shadow-lg shadow-amber-500/25 border border-amber-300/40">
          設定傾斜角度上限
        </button>

        <button id="startBtn" type="button" disabled
                class="game-btn w-full py-4 px-5 rounded-2xl font-extrabold text-lg sm:text-xl tracking-wider bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 shadow-lg shadow-emerald-500/25 border border-emerald-300/40">
          開始挑戰
        </button>
      </div>

      <!-- 校準中或計時中的狀態提示按鈕（防誤觸鎖定，僅顯示狀態） -->
      <div id="activeStatusBar" class="hidden w-full py-4 px-5 rounded-2xl bg-slate-900/90 border border-slate-700 text-center">
        <span id="activeStatusLabel" class="text-base font-bold text-emerald-400 tracking-wide">
          保持穩定滿 3 秒自動鳴笛開始...
        </span>
      </div>

      <!-- 5秒警報結束後的「重新開始」按鈕 -->
      <button id="restartBtn" type="button"
              class="hidden game-btn w-full py-4 px-5 rounded-2xl font-extrabold text-lg sm:text-xl tracking-wider bg-gradient-to-r from-sky-500 to-blue-600 text-white shadow-lg shadow-sky-500/30 border border-sky-300/40">
        重新開始
      </button>
    </footer>

  </div>

  <script>
    /**
     * 遊戲狀態定義
     * IDLE: 初始待機，顯示即時角度，可設定傾斜上限與按下開始
     * CALIBRATING: 連續維持在傾斜上限內 3.0 秒準備期
     * RUNNING: 起跑號角響起，正式碼表計時中
     * ALARM: 超出傾斜上限，碼表凍結，整片紅閃 + 急促蜂鳴 5 秒鎖定
     * GAME_OVER: 5 秒警示結束，顯示最終成績與「重新開始」按鈕
     */
    const GAME_STATE = {
      IDLE: 'IDLE',
      CALIBRATING: 'CALIBRATING',
      RUNNING: 'RUNNING',
      ALARM: 'ALARM',
      GAME_OVER: 'GAME_OVER'
    };

    // 核心狀態變數
    let currentState = GAME_STATE.IDLE;
    let currentTiltDeg = 0.0;        // 經過低通濾波的總傾斜角度 (0° ~ 90°)
    let rawTiltDeg = 0.0;            // 原始感測計算角度
    let tiltLimitDeg = null;         // 鎖定的傾斜角度上限 (null 代表尚未設定)
    let isLimitSet = false;          // 是否已按下「設定傾斜角度上限」

    // 感測器狀態
    let sensorActive = false;
    let usingRealSensor = false;
    let hasFilteredInit = false;
    const FILTER_ALPHA = 0.28;       // 低通濾波係數 (兼顧靈敏度與抗手抖)

    // 計時與動畫控制
    const CALIBRATE_REQUIRED_MS = 3000; // 需連續保持穩定 3 秒
    const ALARM_DURATION_MS = 5000;     // 失敗紅閃蜂鳴鎖定 5 秒
    let calibrateStartTime = null;
    let runStartTime = null;
    let finalElapsedMs = 0;
    let alarmEndTimeout = null;
    let rafId = null;

    // Web Audio API & Wake Lock
    let audioCtx = null;
    let alarmIntervalId = null;
    let wakeLockSentinel = null;

    // 圓環周長 (r = 114 -> 2 * PI * 114 ≈ 716.28)
    const RING_CIRCUMFERENCE = 2 * Math.PI * 114;

    // DOM 元素快取
    const el = {
      appRoot: document.getElementById('appRoot'),
      sensorDot: document.getElementById('sensorDot'),
      sensorStatusText: document.getElementById('sensorStatusText'),
      toggleSimBtn: document.getElementById('toggleSimBtn'),
      simPanel: document.getElementById('simPanel'),
      simSlider: document.getElementById('simSlider'),
      simValLabel: document.getElementById('simValLabel'),
      phaseBadge: document.getElementById('phaseBadge'),
      progressRing: document.getElementById('progressRing'),
      currentAngleDisplay: document.getElementById('currentAngleDisplay'),
      limitAngleDisplay: document.getElementById('limitAngleDisplay'),
      calibrateSubBox: document.getElementById('calibrateSubBox'),
      calibrateTimerText: document.getElementById('calibrateTimerText'),
      stopwatchDisplay: document.getElementById('stopwatchDisplay'),
      triggerAngleNote: document.getElementById('triggerAngleNote'),
      instructionText: document.getElementById('instructionText'),
      idleControls: document.getElementById('idleControls'),
      setLimitBtn: document.getElementById('setLimitBtn'),
      startBtn: document.getElementById('startBtn'),
      activeStatusBar: document.getElementById('activeStatusBar'),
      activeStatusLabel: document.getElementById('activeStatusLabel'),
      restartBtn: document.getElementById('restartBtn')
    };

    /* =========================================================================
       1. Web Audio API 音效合成引擎 (大聲起跑號角 & 急促蜂鳴警報)
       ========================================================================= */

    /**
     * 初始化並解鎖 AudioContext（必須在使用者點擊按鈕事件中呼叫）
     */
    function initAndUnlockAudio() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        // 播放極短靜音緩衝區確保 iOS Safari 完全解鎖音訊通道
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
      } catch (err) {
        console.warn('AudioContext 初始化警告:', err);
      }
    }

    /**
     * 播放大聲「起跑號角」音效 (滿 3 秒進入計時瞬間觸發)
     * 使用多顆鋸齒波與方波疊加銅管三和弦 + 動態壓縮器推大音量
     */
    function playStartHorn() {
      if (!audioCtx) initAndUnlockAudio();
      if (!audioCtx) return;

      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const duration = 0.85; // 號角鳴響長度

        // 動態壓縮器防止破音同時最大化手機喇叭響度
        const compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-12, now);
        compressor.knee.setValueAtTime(10, now);
        compressor.ratio.setValueAtTime(8, now);
        compressor.attack.setValueAtTime(0.005, now);
        compressor.release.setValueAtTime(0.15, now);
        compressor.connect(audioCtx.destination);

        // 主音量增益
        const masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.01, now);
        masterGain.gain.linearRampToValueAtTime(1.0, now + 0.04); // 快速起音衝擊感
        masterGain.gain.setValueAtTime(0.95, now + duration - 0.15);
        masterGain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        masterGain.connect(compressor);

        // 號角銅管和弦頻率 (F4 + A4 + C5 + F5 飽滿號角感)
        const freqs = [349.23, 440.00, 523.25, 698.46];

        freqs.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const filter = audioCtx.createBiquadFilter();
          const oscGain = audioCtx.createGain();

          // 混合鋸齒波與方波產生明亮穿透的號角音色
          osc.type = idx % 2 === 0 ? 'sawtooth' : 'square';
          // 起音微幅上滑音高模擬真實吹奏號角
          osc.frequency.setValueAtTime(freq * 0.94, now);
          osc.frequency.exponentialRampToValueAtTime(freq, now + 0.06);

          // 低通濾波修飾刺耳高頻並保留銅管亮澤
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1400, now);
          filter.frequency.exponentialRampToValueAtTime(3200, now + 0.12);

          oscGain.gain.setValueAtTime(idx === 3 ? 0.35 : 0.45, now);

          osc.connect(filter);
          filter.connect(oscGain);
          oscGain.connect(masterGain);

          osc.start(now);
          osc.stop(now + duration);
        });
      } catch (err) {
        console.error('起跑號角播放失敗:', err);
      }
    }

    /**
     * 啟動 5 秒「急促蜂鳴警報聲」(每秒約 7.5 次高頻急促蜂鳴)
     */
    function startAlarmBuzzer() {
      stopAlarmBuzzer();
      if (!audioCtx) initAndUnlockAudio();
      if (!audioCtx) return;

      let step = 0;
      const triggerSingleBeep = () => {
        if (!audioCtx || currentState !== GAME_STATE.ALARM) return;
        try {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const now = audioCtx.currentTime;
          const beepLen = 0.075;

          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          // 雙音高頻急促交替 (2600Hz / 3100Hz 穿透力極強)
          osc.type = 'square';
          osc.frequency.setValueAtTime(step % 2 === 0 ? 2650 : 3150, now);

          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.95, now + 0.008);
          gain.gain.setValueAtTime(0.95, now + beepLen - 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + beepLen);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now);
          osc.stop(now + beepLen);
          step++;
        } catch (e) {
          console.warn('蜂鳴單音錯誤:', e);
        }
      };

      // 立即響第一聲，接著每 130ms 急促鳴叫一次
      triggerSingleBeep();
      alarmIntervalId = setInterval(triggerSingleBeep, 130);
    }

    /**
     * 停止急促蜂鳴警報聲
     */
    function stopAlarmBuzzer() {
      if (alarmIntervalId !== null) {
        clearInterval(alarmIntervalId);
        alarmIntervalId = null;
      }
    }

    /* =========================================================================
       2. 螢幕常亮控制 (Screen Wake Lock API)
       ========================================================================= */
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && !wakeLockSentinel) {
          wakeLockSentinel = await navigator.wakeLock.request('screen');
          wakeLockSentinel.addEventListener('release', () => {
            wakeLockSentinel = null;
          });
        }
      } catch (err) {
        // 部份瀏覽器或低電量模式不支援時靜默忽略
      }
    }

    /* =========================================================================
       3. 動作與方向感測器邏輯 (總傾斜角度 0° ~ 90°)
       ========================================================================= */

    /**
     * 請求 iOS 13+ 感測器權限並綁定監聽器
     */
    async function ensureSensorPermission() {
      initAndUnlockAudio();
      requestWakeLock();

      if (sensorActive) return true;

      try {
        // iOS 13+ 需要明確請求 DeviceMotionEvent 權限
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          const motionRes = await DeviceMotionEvent.requestPermission();
          if (motionRes !== 'granted') {
            updateSensorStatus(false, '感測器權限被拒絕，請允許動作存取');
            return false;
          }
        }

        // 若同時支援 DeviceOrientationEvent.requestPermission 也一併請求作為備援
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          try {
            await DeviceOrientationEvent.requestPermission();
          } catch (e) {
            // 忽略 orientation 權限錯誤，主要依賴 DeviceMotion
          }
        }

        bindSensorListeners();
        return true;
      } catch (err) {
        console.warn('感測器權限請求異常:', err);
        bindSensorListeners();
        return true;
      }
    }

    /**
     * 綁定 DeviceMotion 與 DeviceOrientation 事件
     */
    function bindSensorListeners() {
      if (sensorActive) return;
      sensorActive = true;

      // 主要感測器：利用重力加速度向量計算相對於完全水平的真實總傾角
      window.addEventListener('devicemotion', handleDeviceMotion, { passive: true });
      // 備援感測器：若裝置僅回傳歐拉角 (beta / gamma)
      window.addEventListener('deviceorientation', handleDeviceOrientation, { passive: true });

      updateSensorStatus(true, '感測器已連線');
    }

    /**
     * 處理重力加速度數據 -> 計算總傾斜度數 (0° ~ 90°)
     */
    function handleDeviceMotion(event) {
      const acc = event.accelerationIncludingGravity;
      if (!acc || (acc.x === null && acc.y === null && acc.z === null)) return;

      const x = acc.x || 0;
      const y = acc.y || 0;
      const z = acc.z || 0;
      const magnitude = Math.sqrt(x * x + y * y + z * z);

      if (magnitude < 0.1) return; // 避免自由落體或無效零向量

      usingRealSensor = true;
      updateSensorStatus(true, '陀螺儀即時偵測中');

      // 計算重力向量與 Z 軸（垂直螢幕法線）的夾角，即為手機相對於水平面的總傾斜角度
      const cosTheta = Math.min(1, Math.max(0, Math.abs(z) / magnitude));
      const deg = Math.acos(cosTheta) * (180 / Math.PI);

      applyFilteredTilt(deg);
    }

    /**
     * 降級備援：若裝置不提供 accelerationIncludingGravity，使用 beta / gamma 計算總傾角
     */
    function handleDeviceOrientation(event) {
      if (usingRealSensor) return; // 已有精準重力加速度資料時優先使用
      if (event.beta === null || event.gamma === null) return;

      updateSensorStatus(true, '方向感測器偵測中');

      // 將前後(beta)與左右(gamma)傾角轉換為空間總傾斜角度
      const betaRad = (event.beta * Math.PI) / 180;
      const gammaRad = (event.gamma * Math.PI) / 180;
      const cosTotal = Math.min(1, Math.max(0, Math.abs(Math.cos(betaRad) * Math.cos(gammaRad))));
      const deg = Math.acos(cosTotal) * (180 / Math.PI);

      applyFilteredTilt(deg);
    }

    /**
     * 套用低通濾波器平滑雜訊
     */
    function applyFilteredTilt(newDeg) {
      rawTiltDeg = Math.min(90, Math.max(0, newDeg));
      if (!hasFilteredInit) {
        currentTiltDeg = rawTiltDeg;
        hasFilteredInit = true;
      } else {
        currentTiltDeg = currentTiltDeg + FILTER_ALPHA * (rawTiltDeg - currentTiltDeg);
      }
    }

    function updateSensorStatus(isOk, text) {
      el.sensorStatusText.textContent = text;
      if (isOk) {
        el.sensorDot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400';
      } else {
        el.sensorDot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping';
      }
    }

    /* =========================================================================
       4. 遊戲狀態機與流程控制
       ========================================================================= */

    /**
     * 格式化毫秒為 分:秒:毫秒 (MM:SS.mmm)
     */
    function formatStopwatch(ms) {
      const safeMs = Math.max(0, Math.floor(ms));
      const minutes = Math.floor(safeMs / 60000);
      const seconds = Math.floor((safeMs % 60000) / 1000);
      const millis = safeMs % 1000;

      const mm = String(minutes).padStart(2, '0');
      const ss = String(seconds).padStart(2, '0');
      const mmm = String(millis).padStart(3, '0');
      return `${mm}:${ss}.${mmm}`;
    }

    /**
     * 更新進度環顯示
     * @param {number} ratio 0 ~ 1 之間的比例
     * @param {string} colorHex 圓環顏色
     */
    function setRingProgress(ratio, colorHex) {
      const clamped = Math.min(1, Math.max(0, ratio));
      const offset = RING_CIRCUMFERENCE * (1 - clamped);
      el.progressRing.style.strokeDashoffset = offset.toFixed(2);
      el.progressRing.style.stroke = colorHex;
    }

    /**
     * 切換至階段一：IDLE (初始待機)
     */
    function enterIdleState() {
      currentState = GAME_STATE.IDLE;
      stopAlarmBuzzer();
      if (alarmEndTimeout) {
        clearTimeout(alarmEndTimeout);
        alarmEndTimeout = null;
      }

      // 清除紅閃樣式
      document.body.classList.remove('alarm-flashing');
      el.appRoot.classList.remove('alarm-flashing');

      // 重置碼表與UI
      finalElapsedMs = 0;
      calibrateStartTime = null;
      runStartTime = null;
      el.stopwatchDisplay.textContent = '00:00.000';
      el.stopwatchDisplay.className = 'font-mono-tabular text-4xl sm:text-5xl font-extrabold tracking-tight text-slate-200';
      el.triggerAngleNote.classList.add('hidden');
      el.calibrateSubBox.classList.add('hidden');

      el.phaseBadge.textContent = isLimitSet ? '準備就緒：可按下開始挑戰' : '步驟 1：設定傾斜角度上限';
      el.phaseBadge.className = 'mb-3 px-4 py-1.5 rounded-full text-sm font-bold tracking-wider bg-slate-800/90 text-sky-400 border border-slate-700/80 shadow';

      el.instructionText.textContent = isLimitSet
        ? `上限已鎖定為 ${tiltLimitDeg.toFixed(1)}°，可重新設定或按「開始挑戰」`
        : '將手機擺到目標極限斜度，按下「設定傾斜角度上限」';

      el.idleControls.classList.remove('hidden');
      el.activeStatusBar.classList.add('hidden');
      el.restartBtn.classList.add('hidden');

      el.startBtn.disabled = !isLimitSet;
      setRingProgress(0, '#38bdf8');
    }

    /**
     * 按下「設定傾斜角度上限」
     */
    async function handleSetLimit() {
      await ensureSensorPermission();
      if (currentState !== GAME_STATE.IDLE) return;

      // 抓取當下即時傾斜角度（至少保留 0.5° 避免完全靜止 0.0° 無法維持）
      const captured = Math.max(0.5, Number(currentTiltDeg.toFixed(1)));
      tiltLimitDeg = captured;
      isLimitSet = true;

      el.limitAngleDisplay.textContent = `${tiltLimitDeg.toFixed(1)}°`;
      el.limitAngleDisplay.className = 'font-mono-tabular text-sm font-extrabold text-emerald-400';

      el.phaseBadge.textContent = '上限已鎖定！請按「開始挑戰」';
      el.phaseBadge.className = 'mb-3 px-4 py-1.5 rounded-full text-sm font-bold tracking-wider bg-emerald-950/90 text-emerald-300 border border-emerald-500/50 shadow';

      el.instructionText.textContent = `已設定上限為 ${tiltLimitDeg.toFixed(1)}°（可隨時重設，或按下方開始）`;
      el.startBtn.disabled = false;
    }

    /**
     * 按下「開始挑戰」 -> 進入階段二：CALIBRATING (連續 3 秒穩定準備期)
     */
    async function handleStartGame() {
      await ensureSensorPermission();
      if (!isLimitSet || tiltLimitDeg === null) return;
      if (currentState !== GAME_STATE.IDLE) return;

      currentState = GAME_STATE.CALIBRATING;
      calibrateStartTime = null;

      el.idleControls.classList.add('hidden');
      el.restartBtn.classList.add('hidden');
      el.activeStatusBar.classList.remove('hidden');
      el.calibrateSubBox.classList.remove('hidden');

      el.phaseBadge.textContent = '準備期：連續保持穩定 3 秒';
      el.phaseBadge.className = 'mb-3 px-4 py-1.5 rounded-full text-sm font-bold tracking-wider bg-amber-950/90 text-amber-300 border border-amber-500/50 shadow';
      el.activeStatusLabel.textContent = '正在偵測角度穩定度...';
      el.activeStatusLabel.className = 'text-base font-bold text-amber-300 tracking-wide';
    }

    /**
     * 進入階段三：RUNNING (起跑號角 + 正式碼表計時)
     */
    function enterRunningState(now) {
      currentState = GAME_STATE.RUNNING;
      runStartTime = now;

      // 發出大聲起跑號角音效！
      playStartHorn();

      el.calibrateSubBox.classList.add('hidden');
      el.phaseBadge.textContent = '計時中！請勿超過傾斜上限';
      el.phaseBadge.className = 'mb-3 px-4 py-1.5 rounded-full text-sm font-bold tracking-wider bg-emerald-950/95 text-emerald-300 border border-emerald-400/60 shadow';

      el.stopwatchDisplay.className = 'font-mono-tabular text-4xl sm:text-5xl font-extrabold tracking-tight text-emerald-400';
      el.instructionText.textContent = `保持傾斜角度 ≤ ${tiltLimitDeg.toFixed(1)}°！超過即刻停止`;
      el.activeStatusLabel.textContent = '🔥 挑戰進行中（盲測聽覺判定）';
      el.activeStatusLabel.className = 'text-base font-bold text-emerald-400 tracking-wide';
    }

    /**
     * 進入階段四：ALARM (超出上限！碼表停止 + 急促紅閃 + 急促蜂鳴 5 秒鎖定)
     */
    function enterAlarmState(now, triggerDeg) {
      currentState = GAME_STATE.ALARM;
      finalElapsedMs = now - runStartTime;

      // 凍結碼表成績
      el.stopwatchDisplay.textContent = formatStopwatch(finalElapsedMs);
      el.stopwatchDisplay.className = 'font-mono-tabular text-4xl sm:text-5xl font-extrabold tracking-tight text-white';

      // 顯示觸發失敗當下的角度
      el.triggerAngleNote.textContent = `觸發傾角: ${triggerDeg.toFixed(1)}° (> ${tiltLimitDeg.toFixed(1)}°)`;
      el.triggerAngleNote.classList.remove('hidden');

      // 啟動整片急促紅光閃爍 & 急促蜂鳴 5 秒
      document.body.classList.add('alarm-flashing');
      startAlarmBuzzer();

      el.phaseBadge.textContent = '⚠️ 超出傾斜上限！挑戰失敗';
      el.phaseBadge.className = 'mb-3 px-4 py-1.5 rounded-full text-sm font-black tracking-wider bg-black/80 text-red-400 border border-red-400 shadow';
      el.instructionText.textContent = '警示鎖定 5 秒鐘，請稍候...';
      el.activeStatusLabel.textContent = '🚨 失衡警報鳴響中 (5 秒鎖定)';
      el.activeStatusLabel.className = 'text-base font-black text-red-300 tracking-wide';

      setRingProgress(1, '#ef4444');

      // 鎖定滿 5.0 秒後自動切換到階段五 (GAME_OVER)
      alarmEndTimeout = setTimeout(() => {
        enterGameOverState();
      }, ALARM_DURATION_MS);
    }

    /**
     * 進入階段五：GAME_OVER (5 秒警示結束，下方出現「重新開始」按鈕)
     */
    function enterGameOverState() {
      currentState = GAME_STATE.GAME_OVER;

      // 停止紅閃與蜂鳴
      document.body.classList.remove('alarm-flashing');
      stopAlarmBuzzer();

      el.phaseBadge.textContent = '挑戰結束 - 最終成績';
      el.phaseBadge.className = 'mb-3 px-4 py-1.5 rounded-full text-sm font-bold tracking-wider bg-rose-950/90 text-rose-300 border border-rose-500/50 shadow';
      el.stopwatchDisplay.className = 'font-mono-tabular text-4xl sm:text-5xl font-extrabold tracking-tight text-rose-400';
      el.instructionText.textContent = '點擊下方「重新開始」回到初始畫面';

      // 隱藏鎖定提示條，顯示「重新開始」按鈕
      el.activeStatusBar.classList.add('hidden');
      el.restartBtn.classList.remove('hidden');
    }

    /* =========================================================================
       5. 主動畫與高頻判定迴圈 (requestAnimationFrame)
       ========================================================================= */
    function mainLoop(now) {
      // 1. 更新畫面上即時傾斜角度數值
      el.currentAngleDisplay.textContent = `${currentTiltDeg.toFixed(1)}°`;

      // 2. 根據不同遊戲狀態執行核心判定邏輯
      if (currentState === GAME_STATE.IDLE) {
        // 待機狀態：圓環顯示目前角度相對於上限（或 45°）的比例
        const refMax = isLimitSet && tiltLimitDeg > 0 ? tiltLimitDeg : 45;
        const ratio = currentTiltDeg / refMax;
        const isOver = isLimitSet && currentTiltDeg > tiltLimitDeg;
        setRingProgress(Math.min(1, ratio), isOver ? '#f43f5e' : '#38bdf8');
        el.currentAngleDisplay.className = `font-mono-tabular text-5xl sm:text-6xl font-extrabold tracking-tight ${isOver ? 'text-rose-400' : 'text-white'}`;
      }
      else if (currentState === GAME_STATE.CALIBRATING) {
        // 階段二：必須連續維持 currentTiltDeg <= tiltLimitDeg 滿 3 秒
        if (currentTiltDeg <= tiltLimitDeg) {
          if (calibrateStartTime === null) {
            calibrateStartTime = now;
          }
          const heldMs = now - calibrateStartTime;
          const remainingSec = Math.max(0, (CALIBRATE_REQUIRED_MS - heldMs) / 1000);
          const progress = heldMs / CALIBRATE_REQUIRED_MS;

          el.calibrateTimerText.textContent = `${remainingSec.toFixed(1)}s`;
          el.calibrateTimerText.className = 'font-mono-tabular text-2xl font-black text-emerald-400';
          el.currentAngleDisplay.className = 'font-mono-tabular text-5xl sm:text-6xl font-extrabold tracking-tight text-emerald-300';
          el.instructionText.textContent = `保持穩定！還需維持 ${remainingSec.toFixed(1)} 秒...`;
          setRingProgress(progress, '#10b981');

          // 連續維持滿 3.0 秒 -> 鳴笛起跑並開始計時！
          if (heldMs >= CALIBRATE_REQUIRED_MS) {
            enterRunningState(now);
          }
        } else {
          // 中途超出傾斜角度上限 -> 3 秒歸零重算！
          calibrateStartTime = null;
          el.calibrateTimerText.textContent = '3.0s';
          el.calibrateTimerText.className = 'font-mono-tabular text-2xl font-black text-rose-400';
          el.currentAngleDisplay.className = 'font-mono-tabular text-5xl sm:text-6xl font-extrabold tracking-tight text-rose-400';
          el.instructionText.textContent = `超出上限 (${tiltLimitDeg.toFixed(1)}°)！請回穩以重新計算 3 秒`;
          setRingProgress(0, '#f43f5e');
        }
      }
      else if (currentState === GAME_STATE.RUNNING) {
        // 階段三：更新精準碼表，並即時檢查是否超過傾斜角度上限
        const elapsed = now - runStartTime;
        el.stopwatchDisplay.textContent = formatStopwatch(elapsed);

        const dangerRatio = tiltLimitDeg > 0 ? currentTiltDeg / tiltLimitDeg : 1;
        setRingProgress(Math.min(1, dangerRatio), dangerRatio > 0.85 ? '#f59e0b' : '#10b981');

        // 判定條件：只要大於傾斜角度上限，立刻觸發失敗！
        if (currentTiltDeg > tiltLimitDeg) {
          enterAlarmState(now, currentTiltDeg);
        }
      }
      // ALARM 與 GAME_OVER 狀態下鎖定成績與畫面，不做任何角度觸發

      rafId = requestAnimationFrame(mainLoop);
    }

    /* =========================================================================
       6. 事件綁定與初始化
       ========================================================================= */

    // 按鈕事件
    el.setLimitBtn.addEventListener('click', handleSetLimit);
    el.startBtn.addEventListener('click', handleStartGame);
    el.restartBtn.addEventListener('click', () => {
      initAndUnlockAudio();
      enterIdleState();
    });

    // 桌面模擬測試面板事件
    el.toggleSimBtn.addEventListener('click', () => {
      initAndUnlockAudio();
      el.simPanel.classList.toggle('hidden');
    });

    el.simSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value) || 0;
      el.simValLabel.textContent = `${val.toFixed(1)}°`;
      if (!usingRealSensor) {
        currentTiltDeg = val;
        rawTiltDeg = val;
        updateSensorStatus(true, '桌面模擬模式運作中');
      }
    });

    // 頁面首次載入時嘗試自動掛載感測器（Android Chrome 通常免授權即可直接讀取即時角度）
    window.addEventListener('load', () => {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission !== 'function') {
        bindSensorListeners();
      }
      enterIdleState();
      rafId = requestAnimationFrame(mainLoop);
    });
  </script>
</body>
