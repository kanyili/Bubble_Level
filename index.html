<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>平衡計時挑戰</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Roboto+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F8F9FA;
      color: #202124;
      overflow: hidden;
      touch-action: manipulation;
    }

    .font-mono-tabular {
      font-family: 'Roboto Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    @keyframes alarmFlash {
      0%, 49% {
        background-color: #EA4335;
        color: #FFFFFF;
      }
      50%, 100% {
        background-color: #FFFFFF;
        color: #EA4335;
      }
    }

    .alarm-active {
      animation: alarmFlash 0.16s infinite;
    }

    .alarm-active .card-surface {
      background-color: rgba(255, 255, 255, 0.94) !important;
      border-color: #EA4335 !important;
      box-shadow: 0 10px 25px rgba(234, 67, 53, 0.35) !important;
    }

    .alarm-active .alarm-text-override {
      color: #D93025 !important;
    }

    .btn-press {
      transition: transform 0.08s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }
    .btn-press:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body id="app-body" class="h-[100dvh] w-screen flex flex-col justify-between">

  <!-- Google 四色頂部裝飾條 -->
  <div class="w-full h-1.5 flex shrink-0">
    <div class="flex-1 bg-[#4285F4]"></div>
    <div class="flex-1 bg-[#EA4335]"></div>
    <div class="flex-1 bg-[#FBBC05]"></div>
    <div class="flex-1 bg-[#34A853]"></div>
  </div>

  <!-- iOS 自動權限引導遮罩（僅在需要使用者手勢觸發權限時顯示） -->
  <div id="ios-permission-overlay" class="hidden fixed inset-0 z-50 bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center">
    <div class="w-16 h-16 rounded-full bg-[#E8F0FE] text-[#4285F4] flex items-center justify-center mb-5 shadow-sm">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
      </svg>
    </div>
    <h2 class="text-2xl font-black text-[#202124] mb-2">啟動手機傾角偵測</h2>
    <p class="text-base text-[#5F6368] mb-7 max-w-xs leading-relaxed">
      輕點下方按鈕允許讀取動作與方向感測器，即可即時顯示手機傾斜角度
    </p>
    <button id="btn-grant-ios" class="btn-press w-full max-w-xs py-4 px-6 rounded-2xl bg-[#4285F4] text-white font-bold text-lg shadow-md">
      點此啟動感測器
    </button>
  </div>

  <!-- 主要內容區 -->
  <main class="flex-1 flex flex-col justify-center gap-4 px-4 pt-3 pb-2 max-w-md w-full mx-auto overflow-hidden">

    <!-- 1. 傾斜上限卡片 -->
    <section class="card-surface bg-white rounded-3xl border border-[#DADCE0] shadow-sm px-5 py-4 flex items-center justify-between">
      <div class="flex flex-col">
        <span class="alarm-text-override text-xl sm:text-2xl font-black text-[#202124] tracking-tight">傾斜上限</span>
        <span class="text-xs sm:text-sm font-medium text-[#5F6368] mt-0.5">超過此角度即觸發警報</span>
      </div>
      <div class="flex items-baseline">
        <span id="limit-angle-display" class="alarm-text-override font-mono-tabular text-5xl sm:text-6xl font-bold text-[#34A853] tracking-tight">30.0</span>
        <span class="alarm-text-override text-2xl sm:text-3xl font-bold text-[#34A853] ml-0.5">°</span>
      </div>
    </section>

    <!-- 2. 當前最新傾斜角度卡片（溫度計概念：最小值 0° ~ 最大值 傾斜上限） -->
    <section class="card-surface bg-white rounded-3xl border border-[#DADCE0] shadow-sm px-5 py-5 flex flex-col items-center justify-center relative">
      <span class="alarm-text-override text-sm sm:text-base font-bold text-[#5F6368] tracking-wide mb-1">當前最新傾斜角度</span>
      <div class="flex items-baseline justify-center my-1">
        <span id="current-angle-display" class="alarm-text-override font-mono-tabular text-6xl sm:text-7xl font-bold text-[#202124] tracking-tight">--.-</span>
        <span class="alarm-text-override text-3xl sm:text-4xl font-bold text-[#5F6368] ml-1">°</span>
      </div>

      <!-- 溫度計式橫向 Bar（0° 至 傾斜上限） -->
      <div class="w-full mt-3">
        <div class="w-full h-3.5 bg-[#F1F3F4] rounded-full overflow-hidden border border-[#E8EAED]">
          <div id="angle-progress-bar" class="h-full bg-[#4285F4] rounded-full transition-all duration-75" style="width: 0%;"></div>
        </div>
        <div class="flex justify-between items-center text-xs font-medium text-[#80868B] mt-1.5 px-0.5">
          <span>0°</span>
          <span id="thermometer-ratio-label" class="font-mono-tabular text-[#5F6368]">0%</span>
          <span id="bar-limit-label" class="font-semibold text-[#34A853]">上限 30.0°</span>
        </div>
      </div>
    </section>

    <!-- 3. 3秒穩定倒數 / 碼表計時 / 5秒警報 主顯示區 -->
    <section id="timer-card" class="card-surface bg-white rounded-3xl border border-[#DADCE0] shadow-sm px-5 py-5 flex flex-col items-center justify-center flex-1 max-h-56">
      <div id="phase-badge" class="px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold bg-[#E8F0FE] text-[#1967D2] mb-2">
        準備就緒
      </div>

      <!-- 碼表時間 (分:秒:毫秒) -->
      <div id="stopwatch-display" class="alarm-text-override font-mono-tabular text-4xl sm:text-5xl font-bold text-[#202124] tracking-tight my-1">
        00:00.000
      </div>

      <!-- 3秒穩定準備進度條（僅在準備期顯示） -->
      <div id="calib-bar-wrap" class="hidden w-full max-w-xs mt-2">
        <div class="w-full h-2.5 bg-[#E8F0FE] rounded-full overflow-hidden">
          <div id="calib-progress-bar" class="h-full bg-[#FBBC05] rounded-full" style="width: 0%;"></div>
        </div>
      </div>

      <p id="phase-hint" class="alarm-text-override text-xs sm:text-sm font-medium text-[#5F6368] mt-2 text-center">
        維持傾斜小於上限滿 3 秒自動鳴笛計時
      </p>
    </section>

  </main>

  <!-- 底部操作按鈕列 -->
  <footer class="px-4 pb-5 pt-2 max-w-md w-full mx-auto shrink-0">
    <!-- 待機狀態：一左一右水平並排 -->
    <div id="idle-controls" class="grid grid-cols-2 gap-3">
      <button id="btn-reset-limit" class="btn-press py-4 px-3 rounded-2xl bg-[#34A853] hover:bg-[#2E9549] text-white font-bold text-base sm:text-lg shadow-sm flex items-center justify-center text-center leading-snug">
        重設傾斜上限
      </button>
      <button id="btn-start" class="btn-press py-4 px-3 rounded-2xl bg-[#4285F4] hover:bg-[#3367D6] text-white font-bold text-base sm:text-lg shadow-sm flex items-center justify-center text-center leading-snug">
        開始挑戰
      </button>
    </div>

    <!-- 進行中提示 -->
    <div id="active-status-bar" class="hidden py-4 px-4 rounded-2xl bg-white border border-[#DADCE0] text-center font-bold text-base text-[#5F6368]">
      偵測進行中...
    </div>

    <!-- 5秒警報結束後：重新開始按鈕 -->
    <button id="btn-restart" class="hidden btn-press w-full py-4 px-6 rounded-2xl bg-[#4285F4] hover:bg-[#3367D6] text-white font-bold text-lg shadow-md">
      重新開始
    </button>
  </footer>

  <script>
    (() => {
      const STATE = {
        IDLE: 'IDLE',
        CALIBRATING: 'CALIBRATING',
        RUNNING: 'RUNNING',
        ALARM: 'ALARM',
        GAME_OVER: 'GAME_OVER'
      };

      let gameState = STATE.IDLE;
      let tiltLimit = 30.0;        // 預設傾斜上限 30 度
      let currentTilt = null;      // 當前最新傾斜角度 (0 ~ 90)
      let smoothedTilt = null;
      let sensorActive = false;

      let calibStartTime = 0;
      let runStartTime = 0;
      let elapsedMs = 0;
      let rafId = null;
      let alarmTimeoutId = null;
      let alarmBeepIntervalId = null;

      const appBody = document.getElementById('app-body');
      const iosOverlay = document.getElementById('ios-permission-overlay');
      const btnGrantIos = document.getElementById('btn-grant-ios');

      const limitAngleDisplay = document.getElementById('limit-angle-display');
      const barLimitLabel = document.getElementById('bar-limit-label');
      const thermometerRatioLabel = document.getElementById('thermometer-ratio-label');
      const currentAngleDisplay = document.getElementById('current-angle-display');
      const angleProgressBar = document.getElementById('angle-progress-bar');

      const phaseBadge = document.getElementById('phase-badge');
      const stopwatchDisplay = document.getElementById('stopwatch-display');
      const calibBarWrap = document.getElementById('calib-bar-wrap');
      const calibProgressBar = document.getElementById('calib-progress-bar');
      const phaseHint = document.getElementById('phase-hint');

      const idleControls = document.getElementById('idle-controls');
      const btnResetLimit = document.getElementById('btn-reset-limit');
      const btnStart = document.getElementById('btn-start');
      const activeStatusBar = document.getElementById('active-status-bar');
      const btnRestart = document.getElementById('btn-restart');

      let audioCtx = null;

      function ensureAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
      }

      // 起跑號角音效
      function playStartHorn() {
        ensureAudioContext();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        const notes = [
          { freqs: [440, 554.37, 659.25], start: 0.0, duration: 0.14, gain: 0.45 },
          { freqs: [587.33, 739.99, 880], start: 0.17, duration: 0.52, gain: 0.55 }
        ];

        notes.forEach(note => {
          const masterGain = audioCtx.createGain();
          masterGain.gain.setValueAtTime(0.001, now + note.start);
          masterGain.gain.linearRampToValueAtTime(note.gain, now + note.start + 0.02);
          masterGain.gain.setValueAtTime(note.gain, now + note.start + note.duration - 0.06);
          masterGain.gain.exponentialRampToValueAtTime(0.001, now + note.start + note.duration);

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(2400, now + note.start);

          masterGain.connect(filter);
          filter.connect(audioCtx.destination);

          note.freqs.forEach(freq => {
            const osc = audioCtx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now + note.start);
            osc.connect(masterGain);
            osc.start(now + note.start);
            osc.stop(now + note.start + note.duration + 0.02);
          });
        });
      }

      // 急促蜂鳴警報聲（持續 5 秒）
      function startAlarmSound() {
        ensureAudioContext();
        stopAlarmSound();

        const triggerSingleBeep = () => {
          if (!audioCtx) return;
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'square';
          osc.frequency.setValueAtTime(980, now);
          osc.frequency.setValueAtTime(760, now + 0.055);

          gain.gain.setValueAtTime(0.42, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now);
          osc.stop(now + 0.115);
        };

        triggerSingleBeep();
        alarmBeepIntervalId = setInterval(triggerSingleBeep, 150);
      }

      function stopAlarmSound() {
        if (alarmBeepIntervalId) {
          clearInterval(alarmBeepIntervalId);
          alarmBeepIntervalId = null;
        }
      }

      function updateTiltReading(rawAngle) {
        if (typeof rawAngle !== 'number' || Number.isNaN(rawAngle)) return;
        const clamped = Math.max(0, Math.min(90, rawAngle));

        if (smoothedTilt === null) {
          smoothedTilt = clamped;
        } else {
          smoothedTilt = smoothedTilt * 0.25 + clamped * 0.75;
        }
        currentTilt = smoothedTilt;
        sensorActive = true;

        renderAngleUI();
      }

      function handleDeviceMotion(event) {
        const acc = event.accelerationIncludingGravity;
        if (!acc || acc.x === null || acc.y === null || acc.z === null) return;

        const { x, y, z } = acc;
        const magnitude = Math.sqrt(x * x + y * y + z * z);
        if (magnitude < 0.1) return;

        const cosTheta = Math.max(-1, Math.min(1, Math.abs(z) / magnitude));
        const angleDeg = (Math.acos(cosTheta) * 180) / Math.PI;
        updateTiltReading(angleDeg);
      }

      function handleDeviceOrientation(event) {
        if (sensorActive) return;
        if (event.beta === null || event.gamma === null) return;

        const betaRad = (event.beta * Math.PI) / 180;
        const gammaRad = (event.gamma * Math.PI) / 180;
        const cosTheta = Math.max(
          -1,
          Math.min(1, Math.abs(Math.cos(betaRad) * Math.cos(gammaRad)))
        );
        const angleDeg = (Math.acos(cosTheta) * 180) / Math.PI;
        updateTiltReading(angleDeg);
      }

      function attachSensorListeners() {
        window.addEventListener('devicemotion', handleDeviceMotion, true);
        window.addEventListener('deviceorientation', handleDeviceOrientation, true);
      }

      async function requestSensorsOnLoad() {
        const needsIosMotionPerm =
          typeof DeviceMotionEvent !== 'undefined' &&
          typeof DeviceMotionEvent.requestPermission === 'function';

        const needsIosOrientPerm =
          typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function';

        if (needsIosMotionPerm || needsIosOrientPerm) {
          iosOverlay.classList.remove('hidden');
        } else {
          attachSensorListeners();
        }
      }

      async function grantIosSensors() {
        ensureAudioContext();
        try {
          if (
            typeof DeviceMotionEvent !== 'undefined' &&
            typeof DeviceMotionEvent.requestPermission === 'function'
          ) {
            const res = await DeviceMotionEvent.requestPermission();
            if (res === 'granted') {
              attachSensorListeners();
            }
          }
          if (
            typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function'
          ) {
            await DeviceOrientationEvent.requestPermission().catch(() => {});
            attachSensorListeners();
          }
        } catch (err) {
          console.warn('Sensor permission error:', err);
        } finally {
          iosOverlay.classList.add('hidden');
        }
      }

      function formatStopwatch(ms) {
        const totalMs = Math.max(0, Math.floor(ms));
        const minutes = Math.floor(totalMs / 60000);
        const seconds = Math.floor((totalMs % 60000) / 1000);
        const millis = totalMs % 1000;

        const mm = String(minutes).padStart(2, '0');
        const ss = String(seconds).padStart(2, '0');
        const mmm = String(millis).padStart(3, '0');
        return `${mm}:${ss}.${mmm}`;
      }

      function renderLimitUI() {
        limitAngleDisplay.textContent = tiltLimit.toFixed(1);
        barLimitLabel.textContent = `上限 ${tiltLimit.toFixed(1)}°`;
      }

      // 溫度計概念：0° 為最低值 (0%)，tiltLimit 為最高值 (100%)
      function renderAngleUI() {
        if (currentTilt === null) {
          currentAngleDisplay.textContent = '--.-';
          angleProgressBar.style.width = '0%';
          thermometerRatioLabel.textContent = '0%';
          return;
        }

        currentAngleDisplay.textContent = currentTilt.toFixed(1);

        const rawRatio = tiltLimit > 0 ? (currentTilt / tiltLimit) * 100 : 100;
        const barWidthPct = Math.max(0, Math.min(100, rawRatio));
        angleProgressBar.style.width = `${barWidthPct}%`;
        thermometerRatioLabel.textContent = `${Math.round(rawRatio)}%`;

        if (currentTilt > tiltLimit) {
          currentAngleDisplay.classList.remove('text-[#202124]');
          currentAngleDisplay.classList.add('text-[#EA4335]');
          angleProgressBar.classList.remove('bg-[#4285F4]', 'bg-[#FBBC05]');
          angleProgressBar.classList.add('bg-[#EA4335]');
        } else if (rawRatio >= 80) {
          currentAngleDisplay.classList.remove('text-[#EA4335]');
          currentAngleDisplay.classList.add('text-[#202124]');
          angleProgressBar.classList.remove('bg-[#4285F4]', 'bg-[#EA4335]');
          angleProgressBar.classList.add('bg-[#FBBC05]');
        } else {
          currentAngleDisplay.classList.remove('text-[#EA4335]');
          currentAngleDisplay.classList.add('text-[#202124]');
          angleProgressBar.classList.remove('bg-[#FBBC05]', 'bg-[#EA4335]');
          angleProgressBar.classList.add('bg-[#4285F4]');
        }
      }

      function setGameState(nextState) {
        gameState = nextState;

        idleControls.classList.add('hidden');
        activeStatusBar.classList.add('hidden');
        btnRestart.classList.add('hidden');
        calibBarWrap.classList.add('hidden');
        appBody.classList.remove('alarm-active');

        if (nextState === STATE.IDLE) {
          elapsedMs = 0;
          stopwatchDisplay.textContent = '00:00.000';
          phaseBadge.className = 'px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold bg-[#E8F0FE] text-[#1967D2] mb-2';
          phaseBadge.textContent = '準備就緒';
          phaseHint.textContent = '維持傾斜小於上限滿 3 秒自動鳴笛計時';
          idleControls.classList.remove('hidden');
        } else if (nextState === STATE.CALIBRATING) {
          calibStartTime = 0;
          stopwatchDisplay.textContent = '3.00 秒';
          phaseBadge.className = 'px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold bg-[#FEF7E0] text-[#B06000] mb-2';
          phaseBadge.textContent = '穩定倒數中';
          phaseHint.textContent = `請將手機傾斜維持在 ${tiltLimit.toFixed(1)}° 以內連續 3 秒`;
          calibBarWrap.classList.remove('hidden');
          calibProgressBar.style.width = '0%';
          activeStatusBar.textContent = '保持穩定，滿 3 秒即鳴笛開始...';
          activeStatusBar.classList.remove('hidden');
        } else if (nextState === STATE.RUNNING) {
          runStartTime = performance.now();
          phaseBadge.className = 'px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold bg-[#E6F4EA] text-[#137333] mb-2';
          phaseBadge.textContent = '計時進行中';
          phaseHint.textContent = `警戒線：${tiltLimit.toFixed(1)}°（超過即刻停止）`;
          activeStatusBar.textContent = '計時中！切勿超過傾斜上限';
          activeStatusBar.classList.remove('hidden');
          playStartHorn();
        } else if (nextState === STATE.ALARM) {
          stopwatchDisplay.textContent = formatStopwatch(elapsedMs);
          phaseBadge.className = 'px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold bg-[#FCE8E6] text-[#C5221F] mb-2';
          phaseBadge.textContent = '超過傾斜上限！';
          phaseHint.textContent = '警報鎖定 5 秒鐘，請稍候...';
          activeStatusBar.textContent = '警報鳴響中（5 秒）...';
          activeStatusBar.classList.remove('hidden');

          appBody.classList.add('alarm-active');
          startAlarmSound();

          if (alarmTimeoutId) clearTimeout(alarmTimeoutId);
          alarmTimeoutId = setTimeout(() => {
            stopAlarmSound();
            setGameState(STATE.GAME_OVER);
          }, 5000);
        } else if (nextState === STATE.GAME_OVER) {
          phaseBadge.className = 'px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold bg-[#F1F3F4] text-[#3C4043] mb-2';
          phaseBadge.textContent = '挑戰結束';
          phaseHint.textContent = '點擊下方按鈕回到初始畫面';
          btnRestart.classList.remove('hidden');
        }
      }

      function gameLoop(now) {
        if (gameState === STATE.CALIBRATING) {
          const isWithinLimit = currentTilt !== null && currentTilt <= tiltLimit;

          if (isWithinLimit) {
            if (calibStartTime === 0) {
              calibStartTime = now;
            }
            const heldMs = now - calibStartTime;
            const remainingSec = Math.max(0, (3000 - heldMs) / 1000);
            const pct = Math.min(100, (heldMs / 3000) * 100);

            stopwatchDisplay.textContent = `${remainingSec.toFixed(2)} 秒`;
            calibProgressBar.style.width = `${pct}%`;

            if (heldMs >= 3000) {
              setGameState(STATE.RUNNING);
            }
          } else {
            calibStartTime = 0;
            stopwatchDisplay.textContent = '3.00 秒';
            calibProgressBar.style.width = '0%';
          }
        } else if (gameState === STATE.RUNNING) {
          elapsedMs = now - runStartTime;
          stopwatchDisplay.textContent = formatStopwatch(elapsedMs);

          if (currentTilt !== null && currentTilt > tiltLimit) {
            setGameState(STATE.ALARM);
          }
        }

        rafId = requestAnimationFrame(gameLoop);
      }

      btnGrantIos.addEventListener('click', grantIosSensors);

      btnResetLimit.addEventListener('click', () => {
        ensureAudioContext();
        if (currentTilt !== null) {
          tiltLimit = Number(currentTilt.toFixed(1));
          renderLimitUI();
          renderAngleUI();
        }
      });

      btnStart.addEventListener('click', () => {
        ensureAudioContext();
        setGameState(STATE.CALIBRATING);
      });

      btnRestart.addEventListener('click', () => {
        ensureAudioContext();
        setGameState(STATE.IDLE);
      });

      document.addEventListener('DOMContentLoaded', () => {
        renderLimitUI();
        setGameState(STATE.IDLE);
        requestSensorsOnLoad();
        rafId = requestAnimationFrame(gameLoop);
      });
    })();
  </script>
</body>
</html>
